<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>ArXiv → reMarkable</h1>
      <span id="health" class="dot" title="Daemon status"></span>
    </header>

    <section id="page">
      <div class="label">Current page</div>
      <div id="url" class="url">—</div>
    </section>

    <button id="send" disabled>Send to reMarkable</button>

    <section id="status" hidden>
      <div class="label">Status</div>
      <div id="stage">queued</div>
      <progress id="bar" max="100" value="0"></progress>
      <pre id="error" hidden></pre>
    </section>

    <footer>
      <a id="open-options" href="#">Options</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
