[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv2rm"
version = "0.1.0"
description = "Convert scientific papers to reMarkable-optimized EPUB format"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Nicolas Thomas", email = "nicolas@example.com"}
]
keywords = ["arxiv", "remarkable", "epub", "pdf", "ocr", "ebook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",

    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",

    # PDF Processing
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",

    # Image Processing
    "Pillow>=10.0.0",
    "piexif>=1.1.3",

    # EPUB Generation
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",

    # HTTP Requests
    "requests>=2.31.0",
    "httpx>=0.25.0",

    # ArXiv
    "arxiv>=2.0.0",

    # LaTeX Processing
    "TexSoup>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]

ocr = [
    "pytesseract>=0.3.10",
]

[project.scripts]
arxiv2rm = "arxiv2rm.cli:main"

[project.urls]
Homepage = "https://github.com/thomnico/arxiv-to-remarkable"
Repository = "https://github.com/thomnico/arxiv-to-remarkable"
Issues = "https://github.com/thomnico/arxiv-to-remarkable/issues"
Documentation = "https://github.com/thomnico/arxiv-to-remarkable#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=arxiv2rm",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "arxiv.*",
    "ebooklib.*",
    "TexSoup.*",
    "piexif.*",
]
ignore_missing_imports = true
